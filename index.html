<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1A17">
<title>Ásó!</title>
<meta name="description" content="Ásó! – vicces böngészős kincskereső játék kutyával, detektorral és ásóval. / A funny browser treasure-hunt game with a dog, a detector and a shovel.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Game view"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div class="chip">
        <div class="tiny" id="hud-mapname"></div>
        <div class="big" id="hud-objective"></div>
      </div>
      <div class="chip">
        <div class="tiny"><span data-i18n="detector"></span> · <span id="det-label"></span></div>
        <div class="segs" id="det-segs"></div>
      </div>
      <div class="chip">
        <div class="tiny" data-i18n="stamina"></div>
        <div class="bar"><div id="stam-fill"></div></div>
      </div>
      <div class="chip hidden" id="load-chip">
        <div class="tiny" data-i18n="load"></div>
        <div class="bar"><div id="load-fill" class="warn"></div></div>
      </div>
      <div class="chip hidden" id="buff-chip">
        <div class="tiny" data-i18n="buff_label"></div>
        <div class="bar"><div id="buff-fill"></div></div>
      </div>
    </div>

    <div id="hud-right">
      <div class="row">
        <div class="chip right">
          <div class="tiny" data-i18n="time"></div>
          <div class="big" id="hud-time">06:00</div>
        </div>
        <button class="iconbtn" id="btn-sound" type="button" data-i18n-aria="sound">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path id="snd-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path id="snd-wave2" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button class="iconbtn" id="btn-phone" type="button" data-i18n-aria="phone_btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>
          <span class="badge hidden" id="phone-badge"></span><span class="keycap">F</span>
        </button>
        <button class="iconbtn" id="btn-pause" type="button" data-i18n-aria="pause">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        </button>
      </div>
      <div class="chip right">
        <div class="tiny"><span data-i18n="cases"></span> <b id="hud-cases">0/5</b></div>
        <div class="cash" id="cash-huf">0 Ft</div>
        <div class="cash" id="cash-eur">0 €</div>
        <div class="cash" id="cash-usd">0 $</div>
      </div>
      <canvas id="radar" width="120" height="120" aria-hidden="true"></canvas>
    </div>

    <div id="center">
      <div id="crosshair"></div>
      <svg id="dig-ring" class="hidden" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="50" fill="rgba(15,26,23,.55)" stroke="rgba(243,239,228,.2)" stroke-width="2"/>
        <circle id="dig-arc" cx="60" cy="60" r="44" fill="none" stroke="#F2B84B" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" transform="rotate(-90 60 60)"/>
      </svg>
      <div id="arrow" class="hidden">
        <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 5L38 33L23 27L8 33Z" fill="#F2B84B" stroke="#1A1307" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div id="arrow-dog" class="hidden">
        <div id="arrow-dog-rot"><svg width="34" height="34" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 5L38 33L23 27L8 33Z" fill="#E9A25A" stroke="#1A1307" stroke-width="2" stroke-linejoin="round"/></svg></div>
        <span id="dog-dist"></span>
      </div>
      <div id="arrow-thief" class="hidden">
        <svg width="40" height="40" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 5L38 33L23 27L8 33Z" fill="#FF5050" stroke="#1A1307" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div id="prompt" class="chip hidden"></div>
    </div>
  </div>

  <div id="bubbles"></div>

  <div id="toast" class="chip hidden" role="status"></div>

  <!-- Safe-cracking mini-game -->
  <div id="safegame" class="hidden">
    <div class="safe-panel">
      <div class="tiny" data-i18n="safe_title"></div>
      <svg id="safe-svg" width="260" height="260" viewBox="0 0 200 200" role="img" aria-label="Safe dial">
        <circle cx="100" cy="100" r="94" fill="rgba(15,26,23,.9)" stroke="#2B4338" stroke-width="3"/>
        <circle cx="100" cy="100" r="78" fill="none" stroke="#243830" stroke-width="16"/>
        <path id="safe-zone" d="" fill="none" stroke="#F2B84B" stroke-width="16"/>
        <line id="safe-marker" x1="100" y1="100" x2="100" y2="12" stroke="#F3EFE4" stroke-width="4" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="9" fill="#F3EFE4"/>
      </svg>
      <div class="pins" id="safe-pins"><i></i><i></i><i></i></div>
      <p class="hint" data-i18n="safe_hint"></p>
      <button class="btn small" id="btn-safe-cancel" type="button" data-i18n="safe_cancel"></button>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touch" class="hidden">
    <div id="joy"><div id="knob"></div></div>
    <button id="btn-whistle" type="button" aria-label="Whistle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F3EFE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="14" r="5"/><path d="M12.5 11L21 8v4l-6 2"/></svg>
    </button>
    <button id="btn-dig" type="button" aria-label="Dig">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1A1307" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6"/><path d="M12 6l6 6-5 5-6-6z"/><path d="M11 13L4 20"/></svg>
      <span data-i18n="dig"></span>
    </button>
  </div>

  <!-- The phone: the Agency's feed -->
  <div id="phone" class="hidden">
    <div class="phone-body">
      <div class="phone-top"><span data-i18n="phone_page"></span><button class="btn small" id="btn-phone-close" type="button" data-i18n="phone_close"></button></div>
      <div id="phone-feed"></div>
    </div>
  </div>

  <!-- Title -->
  <div id="screen-title" class="screen hidden">
    <div class="panel">
      <div class="langbar" role="group" aria-label="Language">
        <button class="btn small langbtn" data-lang="hu" type="button">HU</button>
        <button class="btn small langbtn" data-lang="en" type="button">EN</button>
      </div>
      <h1 class="logo">Ásó!</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="blurb" data-i18n="blurb"></p>
      <div class="actions">
        <button class="btn primary big" id="btn-start" type="button" data-i18n="start"></button>
        <button class="btn" id="btn-help" type="button" data-i18n="howto"></button>
      </div>
      <p class="note" id="title-note"></p>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </div>
  </div>

  <!-- Map select -->
  <div id="screen-maps" class="screen hidden">
    <div class="panel wide">
      <h2 data-i18n="maps_title"></h2>
      <div id="map-list"></div>
      <p class="note" id="campaign-total"></p>
      <div class="actions"><button class="btn" id="btn-maps-back" type="button" data-i18n="back"></button></div>
    </div>
  </div>

  <!-- How to play -->
  <div id="screen-help" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="help_title"></h2>
      <ol class="steps">
        <li data-i18n="help_1"></li>
        <li data-i18n="help_2"></li>
        <li data-i18n="help_3"></li>
        <li data-i18n="help_4"></li>
        <li data-i18n="help_5"></li>
        <li data-i18n="help_6"></li>
      </ol>
      <p class="controls desktop-only" data-i18n="controls_desktop"></p>
      <p class="controls touch-only" data-i18n="controls_touch"></p>
      <div class="actions"><button class="btn primary" id="btn-help-back" type="button" data-i18n="back"></button></div>
    </div>
  </div>

  <!-- Pause -->
  <div id="screen-pause" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="pause_title"></h2>
      <div class="actions col">
        <button class="btn primary big" id="btn-resume" type="button" data-i18n="resume"></button>
        <button class="btn" id="btn-sound2" type="button"></button>
        <button class="btn" id="btn-music" type="button"></button>
        <div class="langbar" role="group" aria-label="Language">
          <button class="btn small langbtn" data-lang="hu" type="button">HU</button>
          <button class="btn small langbtn" data-lang="en" type="button">EN</button>
        </div>
        <button class="btn" id="btn-menu" type="button" data-i18n="main_menu"></button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="screen-results" class="screen hidden">
    <div class="panel">
      <h2 id="res-title"></h2>
      <div class="stamp" id="res-stamp" data-i18n="stamp"></div>
      <div class="totals">
        <div class="tiny" data-i18n="res_total"></div>
        <div class="cash big" id="res-huf"></div>
        <div class="cash" id="res-eur"></div>
        <div class="cash" id="res-usd"></div>
      </div>
      <dl class="stats">
        <div><dt data-i18n="res_cases"></dt><dd id="res-cases"></dd></div>
        <div><dt data-i18n="res_time"></dt><dd id="res-time"></dd></div>
        <div><dt data-i18n="res_digs"></dt><dd id="res-digs"></dd></div>
        <div><dt data-i18n="res_rank"></dt><dd id="res-rank"></dd></div>
      </dl>
      <p class="note" id="res-lost"></p>
      <p class="note" id="res-ach"></p>
      <p class="note" id="res-next"></p>
      <div class="actions">
        <button class="btn primary hidden" id="btn-next" type="button" data-i18n="next_map"></button>
        <button class="btn" id="btn-again" type="button" data-i18n="again"></button>
        <button class="btn" id="btn-share" type="button" data-i18n="share"></button>
        <button class="btn" id="btn-maps2" type="button" data-i18n="maps_btn"></button>
        <button class="btn" id="btn-menu2" type="button" data-i18n="main_menu"></button>
      </div>
      <p class="note" id="share-note"></p>
    </div>
  </div>

  <!-- Loading / error -->
  <div id="loading" class="screen">
    <div class="panel center">
      <h1 class="logo small">Ásó!</h1>
      <p id="loading-line"></p>
    </div>
  </div>
  <div id="screen-error" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="err_title"></h2>
      <p data-i18n="err_body"></p>
    </div>
  </div>
</div>

<!-- Three.js r128 from cdnjs (classic script: works from file:// and GitHub Pages) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/world.js"></script>
<script src="js/maps.js"></script>
<script src="js/actors.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
